[package]
name = "moxml"
version = "0.1.2"
edition = "2021"
description = "The moxml XML processing model — Rust implementation (model + harmonization layer over leptris-rs)"
license = "MIT"
repository = "https://github.com/lutaml/moxml-rs"
homepage = "https://github.com/lutaml/moxml"

[dependencies]
regex = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

# The wasm-opt pass downloads binaryen from the GitHub release CDN,
# which 504'd through 2026-11-08 and broke the v0.1.2 bundle build;
# the optimization is not worth a hard dependency on that host.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
