[package]
name = "moxml"
version = "0.1.7"
edition = "2021"
description = "The moxml XML processing model — Rust implementation (model + harmonization layer over leptris-rs)"
license = "MIT"
repository = "https://github.com/lutaml/moxml-rs"
homepage = "https://github.com/lutaml/moxml"

[features]
default = ["wasm-bindings"]
# Standalone JS bindings are optional when this crate is embedded in another WASM library.
wasm-bindings = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
regex = "1"
quick-xml = "0.36"
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

# The wasm-opt pass downloads binaryen from the GitHub release CDN,
# which 504'd through 2026-11-08 and broke the v0.1.2 bundle build;
# the optimization is not worth a hard dependency on that host.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
