[package]
name = "moxml"
version = "0.1.0"
edition = "2021"
description = "The moxml XML processing model — Rust implementation (model + harmonization layer over leptris-rs)"
license = "MIT"
repository = "https://github.com/lutaml/moxml-rs"
homepage = "https://github.com/lutaml/moxml"

[dependencies]
regex = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]
